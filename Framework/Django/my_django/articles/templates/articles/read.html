{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "articles/style.css" %}">
    <title>Document</title>   
</head>
<body>
    <img src="{% static "articles/sample-1.png" %}" alt="">
    <img src="{% static "sample-2.png" %}" alt="">
    <h1>Articles</h1>    <a href="{% url "articles:create" %}">[new]</a>
    {% comment %} 전체 게시글 출력 {% endcomment %}
    {% for article in articles %}
    <p>Number : {{article.pk}}</p>
    <p>Title : <a href="{% url "articles:detail" article.pk %}">{{article.title}}</a></p>
    <p>content : {{article.content}}</p>
    <hr>
    {% endfor %}
</body>
</html>
