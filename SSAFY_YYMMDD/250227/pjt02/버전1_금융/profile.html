<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Gowun+Dodum&family=Nanum+Myeongjo&display=swap');
        * {
            font-family: 'Gowun Dodum', sans-serif;
          }
      </style>
  </head>
  <body>
    <nav class="navbar sticky-top bg-body-tertiary">
        <div class="w-100 text-center">
            <p class="bg-success p-2 text-white bg-opacity-75 p-2">Edward Lee님의 프로필 페이지</p>
        </div>
    </nav>
    <main class="container w-100">
        <nav class="navbar container border sticky-top bg-body-tertiary">
            <div class="row w-100">
                <div class="offset-4 col-2"><a class="nav-link" href="profile.html">기본 정보 수정</a></div>
                <div class="col-2"><a class="nav-link" href="pordfolio.html">포트폴리오 수정</a></div>
            </div>
        </nav>
        <main class="container border mt-3">
        <header class="w-100 text-center fs-2">기본 정보 수정</header>
        <div class="row">
            <div class="col-sm-6">
                <div class="d-flex flex-column align-items-center">
                    <h1 class="fs-3">프로필 사진</h1>
                    <img class="rounded-circle width-75" src="Screenshot_1.png" alt="">
                    <h1 class="fs-3 mt-2">자기소개</h1>
                    <div class="input-group mb-3">
                        <textarea class="form-control" aria-label="With textarea">안녕하세요. 저는 부자가 되고 싶습니다.</textarea>
                        <button class="btn btn-outline-secondary bg-info text-white" type="button" id="button-addon2">Update</button>
                    </div>
                </div>
            </div>

            <div class="col-sm-6">
                <div class="d-flex flex-column align-items-center">
                    <h1 class="fs-3 mt-2">투자상품 선호도</h1>
                    <div class="d-flex justify-content-center">
                        <div class="form-check form-check-inline mb-5">
                            <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                            <label class="form-check-label" for="inlineCheckbox1">주식</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2">
                            <label class="form-check-label" for="inlineCheckbox2">채권</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="inlineCheckbox3" value="option3" checked>
                            <label class="form-check-label" for="inlineCheckbox3">부동산</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="inlineCheckbox3" value="option3" checked>
                            <label class="form-check-label" for="inlineCheckbox3">가장 화폐</label>
                        </div>
                    </div>
                    <h1 class="fs-3 mt-5">투자 스타일</h1>
                    <div class="form-check form-check-inline">
                        <div class="form-check form-check-inline mb-5">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                            <label class="form-check-label" for="inlineRadio1">안정적</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                            <label class="form-check-label" for="inlineRadio2">중립적</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2" checked>
                            <label class="form-check-label" for="inlineRadio2">공격적</label>
                        </div>
                    </div>
                    <h1 class="fs-3 mt-5">관심 종목</h1>
                    <div class="form-check form-check-inline">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                            <label class="form-check-label" for="inlineCheckbox1">정보기술</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2" checked>
                            <label class="form-check-label" for="inlineCheckbox2">소비자</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="inlineCheckbox3" value="option3" checked>
                            <label class="form-check-label" for="inlineCheckbox3">금융</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    </main>
    <form class="d-flex flex-column border m-4 p-2">
        <div class="d-flex flex-column mb-3">
        <label class="mb-2" for="">회원 번호</label>
        <input type="text" placeholder="1" disabled>
        </div>
        <div class="d-flex flex-column mb-3">
            <label class="mb-2" for="">ID</label>
            <input type="text" placeholder="김싸피" disabled>
            </div>
        <div class="input-group mb-2">
            <label class="w-100 mb-2" for="">Email</label>
            <input type="text" class="form-control" placeholder="이메일을 설정해주세요요" aria-label="Recipient's username" aria-describedby="basic-addon2">
            <span class="input-group-text" id="basic-addon2">@example.com</span>
            <button class="btn btn-outline-secondary text-white bg-info" type="button" id="button-addon2">Update</button>
        </div>
        <div class="input-group mb-2">
            <label class="w-100 mb-2" for="">Nickname</label>
            <input type="text" class="form-control" placeholder="닉네임임을 설정해주세요" aria-label="Recipient's username" aria-describedby="basic-addon2">
            <button class="btn btn-outline-secondary text-white bg-info" type="button" id="button-addon2">Update</button>
        </div>
        <div class="input-group mb-2">
            <label class="w-100 mb-2" for="">나이</label>
            <input type="text" class="form-control" placeholder="나이를를 설정해주세요" aria-label="Recipient's username" aria-describedby="basic-addon2">
            <button class="btn btn-outline-secondary text-white bg-info" type="button" id="button-addon2">Update</button>
        </div>
        <div class="input-group">
            <label class="w-100 mb-2" for="">자산과 연봉</label>
            <div class="d-flex justify-content-between w-100">
                <div class="input-group pe-2">
                    <span class="input-group-text">$</span>
                    <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
                </div>
                <div class="input-group ps-2">
                    <span class="input-group-text">$</span>
                    <input type="text" class="form-control" aria-label="Amount (to the nearest dollar)">
                    <button class="btn btn-outline-secondary text-white bg-info" type="button" id="button-addon2">Update</button>
                </div>
            </div>
        </div>
        </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
