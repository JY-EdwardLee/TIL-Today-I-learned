<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">  
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Gowun+Dodum&family=Nanum+Myeongjo&display=swap');
        * {
            font-family: 'Gowun Dodum', sans-serif;
          }
      </style>
  </head>
  <body>
    <main class="container w-100">
        <nav class="navbar container border sticky-top bg-body-tertiary my-4">
            <div class="row w-100">
                <div class="offset-4 col-2"><a class="nav-link" href="profile.html">기본 정보 수정</a></div>
                <div class="col-2"><a class="nav-link" href="pordfolio.html">포트폴리오 수정</a></div>
            </div>
        </nav>
        <form class="d-flex flex-column border m-4 p-2">
            <div class="d-flex flex-column mb-3">
                <label class="mb-2" for="">회원 번호</label>
                <input type="text" placeholder="1" disabled>
            </div>
            <div class="d-flex flex-column mb-3">
                <label class="mb-2" for="">ID</label>
                <input type="text" placeholder="김싸피" disabled>
            </div>
            <div class="d-flex flex-column mb-3">
                <label class="mb-2" for="">ID</label>
                <input type="text" placeholder="김싸피" disabled>
            </div>
            <div class="d-flex flex-column mb-3">
                <label class="mb-2" for="">저축성향</label>
                <div class="form-check d-flex justify-content-between p-0">
                    <div>
                        <div class="form-check form-check-inline mb-2">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                            <label class="form-check-label" for="inlineRadio1">도전형</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                            <label class="form-check-label" for="inlineRadio2">검소형</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2" checked>
                            <label class="form-check-label" for="inlineRadio2">알뜰형</label>
                        </div>
                    </div>
                    <button class="btn btn-outline-secondary text-white bg-info" type="button" id="button-addon2">Update</button>
                </div>
            <div class="input-group mb-2">
                <label class="w-100 mb-2" for="">최애은행</label>
                <input type="text" class="form-control" placeholder="가장 좋아하는 은행을 입력해주세요." aria-label="Recipient's username" aria-describedby="basic-addon2">
                <button class="btn btn-outline-secondary text-white bg-info" type="button" id="button-addon2">Update</button>
            </div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
