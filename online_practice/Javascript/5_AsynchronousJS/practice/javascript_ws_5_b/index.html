<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .photos img {
      width: 500px;
    }
  </style>
</head>

<body>
  <h1>Mars Rover Photos - Step 2</h1>
  <form class="search-form">
    <label for="input-sol">화성일 : </label>
    <input type="number" class="input-sol" id="input-sol" min="0" max="4000">
    <input type="submit" value="Search">
  </form>
  <div class="photos"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const API_URL = 'https://api.nasa.gov/mars-photos/api/v1/rovers/curiosity/photos'
    const API_KEY = 'NONcv4vZAOqEDdXxgrMe1YSpt2kdnEvLvkFWtV9S'
    const photoContainer = document.querySelector('.photos')
    const inputTag = document.querySelector('.input-sol')
    const formTag = document.querySelector('form')
    const getImg = function(dayofMars) {
      axios({
      method: 'get',
      url: API_URL,
      params: {
        sol: dayofMars,
        api_key: API_KEY,
      }
    })
      .then((response) => {
        console.log(response)
        const photo = response.data.photos[0]
        const imgElement = document.createElement('img')
        imgElement.src = photo.img_src
        const oldImg = photoContainer.querySelector('img')
        if (oldImg) {
          photoContainer.removeChild(oldImg)
        }
        photoContainer.appendChild(imgElement)
      })
      .catch((error) => {
        console.error(error)
      })
    }
    formTag.addEventListener('submit', function(e) {
      e.preventDefault()
      const dayofMars = inputTag.value
      getImg(dayofMars)
    })
  </script>
</body>

</html>
