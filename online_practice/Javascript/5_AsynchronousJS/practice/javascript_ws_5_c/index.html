<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .photos img {
      width: 500px;
    }
  </style>
</head>

<body>
  <h1>Mars Rover Photos - Step 3</h1>
  <form class="search-form">
    <div>
      <select class="select-rover">
        <option value="" selected disabled hidden>--- Select Rover name ---</option>
        <option value="curiosity">Curiosity</option>
        <option value="opportunity">Opportunity</option>
        <option value="spirit">Spirit</option>
      </select>
    </div>
    <label for="input-sol">화성일 : </label>
    <input type="number" class="input-sol" id="input-sol" min="0" max="4000">
    <input type="submit" value="Search">
  </form>
  <div class="photos"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const API_KEY = 'NONcv4vZAOqEDdXxgrMe1YSpt2kdnEvLvkFWtV9S'
    const photoContainer = document.querySelector('.photos')
    const searchForm = document.querySelector('.search-form')
    const selectRover = document.querySelector('.select-rover')
    const getMarsPhotos = function (solValue) {
      photoContainer.textContent = null
      axios({
        method: 'get',
        url: API_URL,
        params: {
          sol: solValue,
          camera : 'NAVCAM',
          api_key: API_KEY,
        },
      })
        .then((response) => {
          console.log(response)
          if (response.data.photos.length === 0) {
            photoContainer.textContent = `로버 Curiosity는 해당 화성일에 찍은 사진이 없습니다.`
          } else {
            if (response.data.photos.length < 3){
            const max_img = response.data.photos.length
            for (let i = 0; i < max_img; i++){
              const photo = response.data.photos[i]
              const pTag = document.createElement('p')
              console.log(photo.earth_date)
              pTag.textContent = response.data.photos[i].earth_date
              const imgElement = document.createElement('img')
              imgElement.src = photo.img_src
              photoContainer.appendChild(pTag)
              photoContainer.appendChild(imgElement)
              const hrTag = document.createElement('hr')
              photoContainer.appendChild(hrTag)
              }
          } else {
            for (let i = 0; i < 3; i++){
              const photo = response.data.photos[i]
              const pTag = document.createElement('p')
              console.log(photo.earth_date)
              pTag.textContent = response.data.photos[i].earth_date
              photoContainer.appendChild(pTag)
              const imgElement = document.createElement('img')
              imgElement.src = photo.img_src
              photoContainer.appendChild(imgElement)
              const hrTag = document.createElement('hr')
              photoContainer.appendChild(hrTag)
              }
          }
          }
        })
        .catch((error) => {
          console.error(error)
        })
    }

    searchForm.addEventListener('submit', function (event) {
      event.preventDefault()
      const rover = selectRover.value
      API_URL = `https://api.nasa.gov/mars-photos/api/v1/rovers/${rover}/photos`
      const solValue = document.querySelector('.input-sol').value
      getMarsPhotos(solValue)
    })
  </script>
</body>

</html>
