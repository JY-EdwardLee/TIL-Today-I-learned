<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    img {
      height: 150px;
    }
  </style>
</head>
<body>
  <h1>Dog API</h1>
  <img draggable="false" src="noResult.png" alt="dog">
  <h2>아직 선택된 사진이 없습니다!</h2>
  <br>
  <button>Get dog</button>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const API_URI = 'https://dog.ceo/api/breeds/image/random'
    const buttonTag = document.querySelector('button')
    const imgTag = document.querySelector('img')
    const h2 = document.querySelector('h2')
    const bodyTag = document.querySelector('body')
    const getDog = function() {
      axios ({
      method : 'get',
      url : API_URI
    }) .then ((response) => {
      console.log(response)
      imgTag.src = response.data.message
    }) .catch ((error) => {
      console.log(error)
    })
    }
    buttonTag.addEventListener('click', function(){
      bodyTag.removeChild(h2)
      getDog()
    })
  </script>
</body>
</html>
