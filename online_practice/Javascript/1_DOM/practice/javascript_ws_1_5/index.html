<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body>
  <section>
    <article class="card" style="width: 18rem;">
      <div class="card-body">
        <h5 class="card-title">Card title</h5>
        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
      </div>
    </article>
    <!-- 아래에 새로운 card 생성 및 추가 -->
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
  <script>
    const sectionTag = document.querySelector('section')
    const article_org = document.querySelector('article')

    // 새 article 생성
    const article_new = document.createElement('article')
    article_new.classList.add('card')
    article_new.setAttribute('style', 'width: 18rem;')

    // div.card-body 생성
    const div = document.createElement('div')
    div.classList.add('card-body')

    // h5, p 생성 및 내용 추가
    const h5 = document.createElement('h5')
    h5.classList.add('card-title')
    h5.textContent = '카드 제목'

    const p = document.createElement('p')
    p.classList.add('card-text')
    p.textContent = '카드 내용'

    // 구조 조립
    div.appendChild(h5)
    div.appendChild(p)
    article_new.appendChild(div)

    // section에 추가
    sectionTag.appendChild(article_new)

    // 기존 article 제거
    sectionTag.removeChild(article_org)
  </script>
</body>
</html>
