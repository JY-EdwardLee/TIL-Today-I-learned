<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .done {
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <form action="/todos/">
    <input type="text">
    <button>Todo</button>
  </form>
  <ul></ul>

<script>
  const form = document.querySelector('form')
  const inputTag = document.querySelector('input')
  const ulTag = document.querySelector('ul')
    
  function addTodo (event) {
    // 이벤트를 취소한다.
    event.preventDefault()
    
    // 빈 값 입력 방지

    // 입력 element를 찾고 해당 입력 element의 value 값을 저장한다.
    const value = inputTag.value.trim()
    if (value == []) {
      window.alert('값을 입력해 주세요.')
    }
    else {
    // li element를 생성 후 input element의 value 값을 데이터로 저장한다
    const liTag = document.createElement('li')
    liTag.textContent = value
    // ul 태그의 자식 태그로 위에서 생성한 li element를 넣는다.
    ulTag.appendChild(liTag)
    inputTag.value = ''

    // 삭제 버튼을 생성 후 li 태그의 자식 태그로 넣는다.
    const deleteBtn = document.createElement('button')
    deleteBtn.textContent = 'X'
    liTag.appendChild(deleteBtn)
    

    // 삭제 버튼을 클릭하면 해당 li element를 삭제한다
    liTag.addEventListener('click', function (x_event) {
      if (x_event.target.textContent === 'X'){
        liTag.remove()
      }
    // li element를 클릭하면 취소선이 토글된다.
      else {
        liTag.style.textDecoration = liTag.style.textDecoration === 'line-through' ? 'none' : 'line-through'
      }
    })
    }
  }

  form.addEventListener('submit', addTodo)
</script>
</body>
</html>
