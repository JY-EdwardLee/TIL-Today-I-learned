<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const scores = [90, 80, 70, 60, 40]
    // for .. of 문으로 코드 작성
    let length = 0 
    let sum = 0
    for (score of scores) {
      sum += score
      length ++
    }
    console.log(length)
    console.log(sum)
    const mean = sum / length
    console.log(mean)
    // while문으로 코드 작성
    let i = length - 1
    while (i >= 0) {
      console.log(scores[i])
      i --
    }
  </script>
</body>
</html>
