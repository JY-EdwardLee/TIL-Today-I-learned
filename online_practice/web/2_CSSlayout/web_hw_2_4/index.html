<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div p {
      color: blue;
    }
    div > p {
      color: crimson;
    }
  </style>
</head>
<body>
  <div>
    <p>자식</p>
      <div style="margin-left: 3rem;">
        <span><p>손자</p></span>
      </div>
    <p>자식</p>
  </div>
</body>
</html>
