{% extends "base.html" %}

{% block content %}
  <h1>할 일 목록 관리 프로젝트 메인 페이지</h1>
  <p>이 곳에서 할 일 목록을 관리합니다.</p>
  <ul>
    {% for todo in todo_list %}
      <li>
        {% if todo.is_completed %}
        <input type="checkbox" name="is_completed" id="is_completed" checked>
        {% else %}
        <input type="checkbox" name="is_completed" id="is_completed">
        {% endif %}
        <a href="{% url "todos:detail" todo.pk %}" for="is_completed">{{ todo.work }}</a>
      </li>
    {% empty %}
      <li>아직 할 일이 없습니다.</li>
    {% endfor %}
  </ul>
{% endblock content %}
