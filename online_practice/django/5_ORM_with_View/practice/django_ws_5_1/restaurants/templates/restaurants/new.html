<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>식당 생성 페이지</h1>
    <form action="{% url "restaurants:create" %}" method="POST">
        {% csrf_token %}
            <div>
                <label for="title">식당 이름:</label>
                <input type="text" name='title' id = 'title'>
            </div>
            <div>
                <label for="describtion">식당 설명:</label>
                <input type="text" name='describtion' id='describtion'>
            </div>
            <div>
                <label for="address">식당 주소: </label>
                <textarea name="address" id="address" rows="10"></textarea>
            </div>
            <div>
                <label for="call">식당 전화번호 </label>
                <textarea name="call" id="call" rows="10"></textarea>
            </div>
        <input type="submit" value="CREATE">
    </form>
    <a href="restaurants:index">[BACK]</a>
</body>
</html>
