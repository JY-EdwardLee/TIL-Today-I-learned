{% extends 'base.html' %}

{% block content %}
<div>
<h1>맛집 리스트</h1>
<a href="{% url 'restaurants:new' %}">[CREATE]</a>
</div>
    <div class="row">
    {% for restaurant in restaurants %}
      <div class="col-sm-4 mb-3 mb-sm-0 gy-2">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">이름: {{ restaurant.name }}</h5>
            <p class="card-text">주소: {{ restaurant.address }}</p>
            <a href="{% url 'restaurants:detail' restaurant.pk %}" class="btn btn-primary">상세보기</a>
          </div>
        </div>
      </div>
    {% endfor %}
    </div>
{% endblock content %}
