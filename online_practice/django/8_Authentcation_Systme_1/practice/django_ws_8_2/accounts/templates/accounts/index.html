{% extends "base.html" %}


{% block content %}
<p>hello, {{user.username}}</p>

<a href="{% url "accounts:login" %}">[LOGIN]</a>
<form action="{% url "accounts:logout" %}" method="post">
    {% csrf_token %}
    <input type="submit" value="LOGOUT">
</form>

<h1>전체 유저 목록</h1>
<ul>
    {% for account in accounts %}
    <li>{{account.username}}
        <ul>
        <li>{{account.score}}</li>
        </ul>
    </li>
    {% endfor %}
</ul>
{% endblock content %}
