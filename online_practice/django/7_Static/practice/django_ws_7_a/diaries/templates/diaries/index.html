{% extends "base.html" %}


{% block content %}
<h1>
    일기장
</h1>

<a href="{% url "diaries:create" %}">[일기 쓰기]</a>
<ul>
    {% if diaries %}
    {% for diary in diaries %}
    <li>{{diary.created_at}}</li>
    <p>{{diary.content}}</p>
    {% endfor %}
    {% else %}
    <li><p>아직 작성한 일기가 없습니다.</p></li>
    {% endif %}
</ul>
{% endblock content %}
