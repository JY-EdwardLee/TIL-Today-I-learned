{% extends "base.html" %}


{% block content %}
<h1>나만의 SNS 서비스</h1>

<a href="{% url "articles:create" %}">[CREATE]</a>
{% for article in articles %}
<div>
{% if article.image %}
<img src="{{article.image.url}}" alt="">
{% endif %}
<a href="{% url "articles:detail" article.pk %}"><p>{{article.title}}</p></a>
<hr>
</div>
{% endfor %}

{% endblock content %}
