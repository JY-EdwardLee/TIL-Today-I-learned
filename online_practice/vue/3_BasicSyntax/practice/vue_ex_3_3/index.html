<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .is-completed {
      text-decoration: line-through;
    }
  </style>
</head>

<body>
  <div id="app">
    <h1>Todo Application</h1>

    <p>Completed Count: {{completedtodoLength}}</p>
    <select v-model="isSelected" name="" id="">
      <option value="all">전체 할 일 보기</option>
      <option value="completed">완료된 할 일 보기</option>
      <option value="in-progress">미완료된 할 일 보기</option>
    </select>
    <form @submit.prevent="addTodo">
      <input type="text" v-model="newTodo">
      <input type="submit" value="Add">
    </form>

    <ul>
      <li v-for="todo in todos" :key="todo.id">
        <input type="checkbox" v-model="todo.isCompleted">
        <span :class="{ 'is-completed': todo.isCompleted }">{{ todo.text }}</span>
        <button @click="deleteTodo(todo.id)">Delete</button>
      </li>
    </ul>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    // 완료된 할 일의 개수 (watch)
    // 체크박스를 클릭하면 해당 항목이 완료되었다고 간주되며, 이때 해당 값을 실시간으로 업데이트한다.
    // `Completed Count: ` 콘텐츠를 가진 HTML p 요소에 출력된다.
    // Vue의 watch 함수를 참고한다.
    // 할 일 목록 필터링 (computed)
    // 필터 종류
    // 전체 할 일 보기: 모든 할 일을 출력한다.
    // 완료된 할 일 보기: 완료된 할 일만 출력한다.
    // 미완료된 할 일 보기: 완료되지 않은 할 일만 출력한다.
    // 첫 화면에는 미완료된 할 일 보기가 선택되어 있어야 한다.
    // HTML select와 option 요소를 활용하며, 기존 form 요소의 하위 요소에 작성한다.
    // Vue의 computed 속성을 참고한다.
    const { createApp, ref, computed, watch } = Vue

    const app = createApp({
      setup() {
        const todos = ref([])
        const newTodo = ref('')
        const completedtodoLength = ref(0)
        const isSelected = ref('all')
        const addTodo = function () {
          if (newTodo.value.trim() !== '') {
            const todoObj = {
              id: Date.now(),
              text: newTodo.value,
              isCompleted: false
            }
            todos.value.push(todoObj)
            newTodo.value = ''
          }
        }
        const filteredTodos = computed(() => {
          if (isSelected.value === 'completed'){
            return todos.value.filter(todo => todo.isCompleted)
          } else if (isSelected.value === 'inprogress'){
            return todos.value.filter(todo => !todo.isCompleted)
          }
          return todos.value
        })
        const todosWatch = watch(todos, ()=> {
          completedtodoLength.value = todos.value.filter(todo => todo.isCompleted).length
        }, { deep: true })
        const deleteTodo = function (todoId) {
          const index = todos.value.findIndex(todo => todo.id === todoId)
          if (index !== -1) {
            todos.value.splice(index, 1)
          }
        }

        return { todos, newTodo, addTodo, deleteTodo, todosWatch, completedtodoLength, filteredTodos }
      }
    })

    app.mount('#app')
  </script>
</body>

</html>
