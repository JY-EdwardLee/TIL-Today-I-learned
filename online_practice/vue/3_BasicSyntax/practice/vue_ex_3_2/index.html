<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .is-completed {
      text-decoration: line-through;
    }
  </style>
</head>

<body>
  <div id="app">
    <h1>Todo Application</h1>
    <form>
      <input type="text" v-model="text">
      <input type="submit" value="Add" @click.prevent="addTodos">
    </form>

    <ul>
      <li v-for="todo in todos" :key="todo.id">
        <input type="checkbox" v-model="todo.isCompleted">
        <span :class="{ 'is-completed': todo.isCompleted }">{{ todo.text }}</span>
        <button @click.prevent="deleteTodo(todo.id)">Delete</button>
      </li>
    </ul>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref } = Vue

    const app = createApp({
      setup() {
        const todos = ref([
          {id: 1, text: 'stack 공부', isCompleted: true},
          {id: 2, text: '그리디 공부', isCompleted: false},
          {id: 3, text: 'DFS 공부', isCompleted: true},
        ])
        const text = ref('')
        const addTodos = ()=>{
          const todo = {
            id: Date.now(),
            text: text.value,
            isCompleted: false
          }
          todos.value.push(todo)
          text.value = ''
        }
        const deleteTodo = (selectedTodo)=>{
            const todoIndex = todos.value.findIndex((todo)=>{
            return todo.id === selectedTodo})
          todos.value.splice(todoIndex,1);
        }
        
        return { todos, text, addTodos, deleteTodo }
      }
    })

    app.mount('#app')
  </script>
</body>

</html>
