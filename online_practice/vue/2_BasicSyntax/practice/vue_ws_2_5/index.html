<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .is-selected {
      background-color: #eee;
    }

    .is-required {
      color: red;
    }
  </style>
</head>
<body>
  <div id="app">

    <h1>다양한 전시 정보</h1>
    <hr>
    <ul>
      <li id="영어 제목" :class="{'is-selected':selected}">
        <label for="selected">전시 선택</label>
        <input type="checkbox" name="selected" value="true" v-model="selected" id="selected">
        <h3>{{koTitle}}</h3>
        <p v-html="description"></p>
        <hr>
        <p>{{artMuseum}}</p>
        <a :href="museumURL">전시장 바로가기</a>
        <hr>
        <p>입장권 구매하기</p>
        <p>가격</p>
        <div>
          <span :class="{'is-required':is_required}">인원 수 : {{persons}} 명 </span>
          <button @click.prevent="decreaseNum" :disabled="persons === 0? true:false">-</button>
          <button @click.prevent="increaseNum" :disabled="persons === 10? true:false">+</button>
        </div>
        <hr>
      </li>
    </ul>
    <p>총 입장료 : {{totalFee}} </p>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    /*
      1. 현재 입장 인원의 수가 0명 초과일 때만, 인원 감소 메서드가 실행되도록 코드를 수정하시오.
2. 현재 입장 인원의 수가 10명 미만일 때만, 인원 증가 메서드가 실행되도록 코드를 수정하시오.
3. 인원 증/감 버튼에 disabled 속성을 부여하시오.
    - 단, 인원수 기준에 따라 true/false가 할당되도록 한다.
    - 인원수 기준은 최소 0명이상 최대 10명 이하이다.
    */

    const { createApp, ref } = Vue
    const app = createApp({
      setup() {
        const koTitle = ref('모네 인사이드')
        const enTitle = ref('monet-inside')
        const artMuseum = ref('예술의 전당')
        const museumURL = ref('https://www.sac.or.kr/')
        const description = ref('<p> &lt;모네 인사이드&gt; 는 빛의 화가 <b>클로드 모네</b>가 남긴 소중한 명작들을 현대적 감각으로 재해석해 음악과 함께 감상하는 미디어아트 전시입니다. </p>')
        const selected = ref(false)
        const is_required = ref(true)
        const persons = ref(0)
        const totalFee = ref(0)
        const decreaseNum = () => {
          if (persons.value > 0) {
            persons.value -= 1
          }
          totalFee.value = persons.value * 1000
          is_required.value = persons.value === 0 ? true : false
        }
        const increaseNum = () => {
          persons.value += 1
          totalFee.value = persons.value * 1000
          is_required.value = persons.value === 0 ? true : false
        }
        return { koTitle, enTitle, artMuseum, museumURL, description, selected, is_required, persons, totalFee, decreaseNum, increaseNum }
      }
    })
    app.mount('#app')
  </script>
</body>
</html>
